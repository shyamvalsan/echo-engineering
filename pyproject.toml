[project]
name = "composed-echo"
version = "0.1.0"
description = "Simulator and inverse designer for a passive post structure that returns a hand clap as a chosen sound."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "auraloss>=0.4.0",
    "cmaes>=0.13.1",
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.8.1",
    "k-wave-python>=0.6.2",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "nevergrad>=1.0.12",
    "numpy>=2.2.6",
    "pystoi>=0.4.1",
    "pytest>=9.2.0",
    "scipy>=1.15.3",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo", "stages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
